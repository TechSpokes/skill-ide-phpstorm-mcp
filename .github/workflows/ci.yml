name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate skill package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # noinspection YAMLSchemaValidation
          # PhpStorm may lag action metadata for setup-node@v6. The action defines this input.
          node-version: "22"

      - name: Validate skill
        run: npm run validate

      - name: Package smoke test
        run: npm run package -- v0.0.0
